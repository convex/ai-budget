name: Release

# Publishes to npm when a version tag (v*) is pushed, using npm **trusted
# publishing** (OIDC) — no stored token. Provenance is attested automatically.
# The dist-tag is derived from the version: a prerelease like 0.0.2-alpha.0
# publishes under `alpha`, a plain 0.1.0 under `latest`.
#
# Setup (one time, on npmjs.com): the package settings for
# @convex-dev/ai-budget → "Trusted Publisher" → GitHub Actions, pointing at
# repo get-convex/ai-budget and workflow file `release.yml`.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # trusted publishing needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"
      # ...and npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Publish (trusted publishing, no token)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"; TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing @convex-dev/ai-budget@$VERSION under dist-tag: $TAG"
          npm publish --tag "$TAG" --access public
